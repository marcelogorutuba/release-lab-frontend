# Called by pipeline.yml; publishing waits for every job here.
name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  vitest:
    name: Vitest (CI list)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Why a list and not the whole suite, and what each entry guards: ci/vitest-list.txt.
      - name: Vitest
        run: |
          node ci/check-vitest-list.mjs --print > "$RUNNER_TEMP/specs.txt"
          mapfile -t specs < "$RUNNER_TEMP/specs.txt"
          npx vitest run --reporter=basic "${specs[@]}"

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc -b && vite build
      - name: Build
        run: npm run build

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Whole repository against eslint-suppressions.json (the debt baseline): only new
      # violations fail. To shrink the baseline after paying debt: npm run lint:fix.
      - name: ESLint
        run: npx eslint . --max-warnings=0 --pass-on-unpruned-suppressions
